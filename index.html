<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA PLAYLIST GENERATION - Engine DJ</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="lib.js"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { aura: { dark: '#0B0F19', panel: '#1E293B', gold: '#D4AF37', cyan: '#00F0FF', tidal: '#00FFFF' } } } }
        }
    </script>
</head>
<body class="min-h-screen flex flex-col">
    <div id="loginScreen" class="flex-1 flex items-center justify-center p-4">
        <div class="glass w-full max-w-md rounded-2xl p-8 shadow-2xl">
            <div class="flex justify-center mb-6">
                <div class="bg-gradient-to-br from-aura-gold to-yellow-600 p-3 rounded-full">
                    <i data-lucide="music" class="w-8 h-8 text-aura-dark"></i>
                </div>
            </div>
            <h1 class="text-3xl font-bold text-center mb-2">AURA</h1>
            <p class="text-slate-400 text-center mb-8">Playlist Generation<br><span class="text-aura-gold text-sm">Engine DJ Edition</span></p>
            <div id="authMessage" class="hidden mb-4 p-3 rounded-lg text-sm"></div>
            <form id="loginForm" class="space-y-4">
                <div class="relative">
                    <i data-lucide="mail" class="absolute left-3 top-3 w-5 h-5 text-slate-400"></i>
                    <input type="email" id="email" placeholder="La tua email" class="w-full bg-slate-900/50 border border-slate-700 rounded-lg py-2.5 pl-10 pr-4 text-white focus:outline-none focus:border-aura-gold transition-colors" required>
                </div>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-3 top-3 w-5 h-5 text-slate-400"></i>
                    <input type="password" id="password" placeholder="Password (min. 6 caratteri)" minlength="6" class="w-full bg-slate-900/50 border border-slate-700 rounded-lg py-2.5 pl-10 pr-4 text-white focus:outline-none focus:border-aura-gold transition-colors" required>
                </div>
                <div id="resetLink" class="text-right">
                    <button type="button" id="forgotPasswordBtn" class="text-xs text-slate-400 hover:text-aura-gold transition-colors">Password dimenticata?</button>
                </div>
                <button type="submit" id="authSubmitBtn" class="w-full bg-gradient-to-r from-aura-gold to-yellow-600 text-aura-dark font-bold py-3 rounded-lg hover:shadow-lg hover:shadow-aura-gold/20 transition-all">Accedi</button>
            </form>
            <p class="text-center text-slate-400 mt-6 text-sm">
                <span id="switchText">Non hai un account?</span>
                <button id="switchModeBtn" class="text-aura-gold hover:underline font-semibold ml-1">Registrati</button>
            </p>
        </div>
    </div>

    <div id="dashboardScreen" class="hidden flex-1 flex flex-col">
        <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
            <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <i data-lucide="sparkles" class="w-6 h-6 text-aura-gold"></i>
                    <h1 class="text-xl font-bold tracking-wide">AURA <span class="text-slate-400 font-normal">ENGINE DJ</span></h1>
                </div>
                <div class="flex items-center gap-4">
                    <span id="userEmail" class="text-sm text-slate-400 hidden sm:block"></span>
                    <button onclick="logout()" class="flex items-center gap-2 text-sm text-slate-400 hover:text-white transition-colors">
                        <i data-lucide="log-out" class="w-4 h-4"></i> Esci
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-6xl mx-auto px-6 py-10 flex-1 space-y-8">
            
            <!-- SEZIONE 1: IMPORTA LIBRERIA -->
            <section class="glass rounded-2xl p-8">
                <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
                    <i data-lucide="upload" class="w-5 h-5 text-aura-cyan"></i> 1. Importa la tua Libreria Engine DJ
                </h2>
                <p class="text-slate-400 mb-6 text-sm">Esporta da Engine DJ in formato <span class="text-aura-gold font-mono">.m3u8</span> o da Rekordbox in <span class="text-slate-300 font-mono">.xml</span>. La libreria verrà salvata nel cloud.</p>
                <div id="dropZone" class="border-2 border-dashed border-slate-600 rounded-xl p-10 text-center hover:border-aura-gold/50 hover:bg-aura-gold/5 transition-all cursor-pointer relative">
                    <input type="file" id="fileInput" accept=".xml,.m3u8,.m3u" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    <i data-lucide="music" class="w-10 h-10 text-slate-500 mx-auto mb-3"></i>
                    <p class="text
